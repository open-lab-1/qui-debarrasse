<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Qui débarrasse ?</title>
        <style>
        body {
            text-align: center;
            background-color: #58d1ef;
            font-family: Arial;
        }
        </style>
    </head>
    <body>
        <input type="file" id="imageInput" accept="image/*" capture="environment" style="display: none;" onchange="analyserTable()">
        <h1>Qui débarrasse la table ?</h1>
        <button onclick="document.getElementById('imageInput').click()">
            Prendre une photo
        </button>
        <h5 id="resultat-photo">Le <strong>résultat </strong>apparaitra ici ...</h5>
        
        <script>
           async function analyserTable() {
                document.getElementById('resultat-photo').innerText = "Photo recu l'ia va l'analyser..."
                
                // Récupération de la photo
                const ma_photo = document.getElementById('imageInput').files[0]
                
                // Préparation du paquet cadeau
                const paquet = new FormData()
                paquet.append('photo', ma_photo)
                
                // Envoi de la photo au serveur Python connecté à ChatGPT
                const reponseServeur = await fetch('https://github.dev', {
                    method: 'POST',
                    body: paquet
                })
                
                // Lecture et affichage du verdict de l'IA
                const donnees = await reponseServeur.json()
                document.getElementById('resultat-photo').innerText = donnees.corvees
           }
        </script>
    </body>
</html>
